# ============================================================
# APPLICATION
# ============================================================

spring.application.name=HR_Employee_Management
server.port=8080


# ============================================================
# DATABASE - MYSQL
# ============================================================

# passwords are NOT stored here - they are read from local.properties (ignored by Git)
spring.config.import=optional:classpath:local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/hr_employee_management?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ============================================================
# CONNECTION POOL - HIKARI
# ============================================================

spring.datasource.hikari.pool-name=HrHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ============================================================
# CACHE - CAFFEINE
# ============================================================

spring.cache.type=caffeine
spring.cache.cache-names=departments,employees
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m


# ============================================================
# SECURITY - BASIC AUTH USERS
# ============================================================

# usernames are here, the passwords come from local.properties
app.security.admin-username=admin
app.security.employee-username=employee


# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=HR Employee Management
info.app.description=Employees, departments, attendance, leave and performance reviews
info.app.version=0.0.1


# ============================================================
# LOGGING
# ============================================================

logging.level.com.hr.employeemanagement=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/hr-employee-management.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method


# ============================================================
# SCHEDULER
# ============================================================

# every Monday to Friday at 11:30 PM
app.attendance.auto-absent-cron=0 30 23 * * MON-FRI
